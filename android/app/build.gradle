plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.firefoxvpn.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.firefoxvpn.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // 锁定为 arm64 架构，与之前 gomobile 编译的 core.aar 保持绝对一致
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.browser:browser:1.8.0' // 登录时调用 Chrome Custom Tabs 所需

    // 核心：引入 gomobile 编译生成的动态库 AAR
    implementation(name: 'core', ext: 'aar')
}
