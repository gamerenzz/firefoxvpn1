name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      # 关键修正：官方锁定 Gradle 8.4，坚决不用测试版的 Gradle 9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Gomobile Tools from Source
        run: |
          git clone --depth 1 https://github.com/golang/mobile.git /tmp/gomobile
          cd /tmp/gomobile/cmd/gomobile && go install .
          cd /tmp/gomobile/cmd/gobind && go install .
          gomobile init

      - name: Compile Go Core to AAR
        run: |
          cd core
          go mod edit -replace golang.org/x/mobile=/tmp/gomobile
          go get golang.org/x/mobile/bind
          go mod tidy
          mkdir -p ../android/app/libs
          gomobile bind -v -androidapi 21 -target=android/arm64 -o ../android/app/libs/core.aar .

      - name: Build Android APK
        run: |
          cd android
          # 使用 setup-gradle 注入的 Gradle 8.4 构建
          gradle assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FirefoxVPN-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
