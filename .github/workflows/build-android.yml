name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 严格锁定 Go 版本为 1.22，彻底阻断 Go 自动漂移到 1.26
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.10'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      # 2. 锁定安装稳定版 gomobile 工具，拒绝 @latest 的激进规则
      - name: Install Gomobile Tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20231127183840-761114570d31
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20231127183840-761114570d31
          gomobile init

      # 3. 编译 AAR（关闭 Go 自动工具链升级 GOTOOLCHAIN=local）
      - name: Compile Go Core to AAR
        env:
          GOTOOLCHAIN: local
        run: |
          cd core
          mkdir -p ../android/app/libs
          gomobile bind -v -androidapi 21 -target=android/arm64 -o ../android/app/libs/core.aar .

      # 4. 构建 Android APK
      - name: Build Android APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 5. 上传 APK 产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FirefoxVPN-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
