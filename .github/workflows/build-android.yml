name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Gomobile Tools from Source
        run: |
          git clone --depth 1 https://github.com/golang/mobile.git /tmp/gomobile
          cd /tmp/gomobile/cmd/gomobile && go install .
          cd /tmp/gomobile/cmd/gobind && go install .
          gomobile init

      - name: Compile Go Core to AAR
        run: |
          cd core
          # 1. 声明本地源码路径
          go mod edit -replace golang.org/x/mobile=/tmp/gomobile
          # 2. 引入真实依赖（由于有了 tools.go，它会永久驻留在依赖图中）
          go get golang.org/x/mobile/bind
          go mod tidy
          # 3. 产出 aar
          mkdir -p ../android/app/libs
          gomobile bind -v -androidapi 21 -target=android/arm64 -o ../android/app/libs/core.aar .

      - name: Build Android APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FirefoxVPN-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
