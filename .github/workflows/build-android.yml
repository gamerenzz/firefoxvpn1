name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      # 关键修改：直接克隆官方仓库安装 gomobile，彻底避开版本号解析失败问题
      - name: Install Gomobile Tools from Source
        run: |
          git clone --depth 1 https://github.com/golang/mobile.git /tmp/gomobile
          cd /tmp/gomobile/cmd/gomobile && go install .
          cd /tmp/gomobile/cmd/gobind && go install .
          gomobile init

      # 关键修改：利用刚刚源码克隆的本地路径，无缝完成绑定，零外部代理依赖
      - name: Compile Go Core to AAR
        run: |
          cd core
          # 将本地真实源码目录替换给当前模块，保证编译绝对能找到 gomobile
          go mod edit -replace golang.org/x/mobile=/tmp/gomobile
          go mod tidy
          mkdir -p ../android/app/libs
          gomobile bind -v -androidapi 21 -target=android/arm64 -o ../android/app/libs/core.aar .

      - name: Build Android APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FirefoxVPN-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
